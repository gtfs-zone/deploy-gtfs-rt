## apps/infra-traefik.yaml — Traefik edge (websecure entrypoint on host :8443).
##
## Wave 1 — after cert-manager exists (routes will reference cert-manager Secrets),
## and so the IngressRoute/Middleware CRDs this chart installs are available to the
## gtfs stack (Phase 7).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      # 38.0.2 = Traefik v3.6.6. Minimum v3.4 is required for the `{url}`
      # placeholder in the errors middleware query (oauth2-errors relies on it
      # to carry the original URL into oauth2-proxy's rd param); on v3.3 the
      # literal "{url}" was sent, rd collapsed to "/", and post-login users
      # landed on auth.gtfs.zone's 404. Charts ≥39 reject our values schema
      # (ports.websecure.tls moved), so 38.x is the ceiling without a values
      # rewrite.
      targetRevision: 38.0.2
      helm:
        valueFiles:
          - $values/infra/traefik/values.yaml
    - repoURL: https://git.kcfam.us/gtfs.zone/deploy-gtfs-rt.git
      targetRevision: k3s-init
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

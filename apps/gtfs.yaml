## apps/gtfs.yaml: the gtfs application stack (Kustomize + KSOPS).
##
## Wave 3: after the infra layer (Longhorn/CNPG/cert-manager at wave 0, Traefik/
## external-dns at wave 1, secrets at wave 2), so the CNPG operator, the longhorn
## StorageClass, and the gtfs namespace all exist before this Cluster/PVCs apply.
##
## No `directory:`/`helm:` source block: the tree contains *.enc.yaml, so ArgoCD's
## plugin discovery routes it through the ksops CMP (same pattern as infra-secrets),
## which runs `kustomize build --enable-alpha-plugins --enable-exec`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gtfs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://git.kcfam.us/gtfs.zone/deploy-gtfs-rt.git
    targetRevision: main
    path: gtfs
  destination:
    server: https://kubernetes.default.svc
    namespace: gtfs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ## Cluster/postgres permanently drifts because CNPG's own mutating admission
  ## webhook defaults ~18 spec fields (postgresql.parameters, probes,
  ## replicationSlots, affinity, etc.) on write. Because we apply via SSA, those
  ## webhook-injected defaults get attributed to argocd-controller's own field
  ## ownership (not a separate manager), so managedFieldsManagers can't filter
  ## them out; only explicit jsonPointers can. List reflects CNPG 1.27's
  ## defaulting webhook as observed on the live object; re-check
  ## `kubectl -n gtfs get cluster postgres -o yaml` after a CNPG upgrade.
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      name: postgres
      jsonPointers:
        - /spec/affinity
        - /spec/enablePDB
        - /spec/failoverDelay
        - /spec/logLevel
        - /spec/maxSyncReplicas
        - /spec/minSyncReplicas
        - /spec/monitoring
        - /spec/postgresGID
        - /spec/postgresUID
        - /spec/postgresql
        - /spec/primaryUpdateMethod
        - /spec/primaryUpdateStrategy
        - /spec/probes
        - /spec/replicationSlots
        - /spec/resources
        - /spec/smartShutdownTimeout
        - /spec/startDelay
        - /spec/stopDelay
        - /spec/switchoverDelay
        - /spec/bootstrap/initdb/encoding
        - /spec/bootstrap/initdb/localeCType
        - /spec/bootstrap/initdb/localeCollate
      jqPathExpressions:
        - .spec.managed.roles[].connectionLimit
        - .spec.managed.roles[].inherit

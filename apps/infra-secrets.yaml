## apps/infra-secrets.yaml — SOPS-encrypted Porkbun credentials for the infra
## layer (cert-manager webhook + external-dns), rendered through the KSOPS CMP.
##
## Wave 2 — after cert-manager (wave 0) and external-dns (wave 1) have created
## their namespaces, so the Secrets land in existing namespaces. Once synced,
## external-dns stops CrashLooping and the gtfs-zone-tls Certificate can issue.
##
## No `directory:`/`helm:` block: leaving the source type unset lets ArgoCD's
## plugin discovery route this tree (it contains *.enc.yaml) through the ksops CMP.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://git.kcfam.us/gtfs.zone/deploy-gtfs-rt.git
    targetRevision: k3s-init
    path: infra/secrets
  destination:
    server: https://kubernetes.default.svc
    # Each Secret sets its own namespace; this default applies to nothing here.
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

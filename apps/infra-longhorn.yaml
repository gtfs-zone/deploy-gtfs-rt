## apps/infra-longhorn.yaml: Longhorn replicated storage (default StorageClass).
##
## Multi-source: the Helm chart from the Longhorn repo, with its values file read
## from THIS git repo via the `$values` ref (industry-standard "Helm chart +
## in-repo values" ArgoCD pattern). Wave 0 so storage exists before anything that
## needs a PVC.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.8.1
      helm:
        valueFiles:
          - $values/infra/longhorn/values.yaml
    - repoURL: https://git.kcfam.us/gtfs.zone/deploy-gtfs-rt.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ## The Longhorn CRDs permanently drift from the rendered chart manifest for
  ## three unrelated reasons, none of which is a real config problem (verified by
  ## diffing `helm template` output against the live objects field-by-field):
  ##   - /status is populated by the API server itself (storedVersions,
  ##     acceptedNames, conditions) and is never part of the applied manifest.
  ##   - /spec/preserveUnknownFields: the chart sets this deprecated v1beta1-era
  ##     field explicitly (false), but the v1 API silently drops it on persist
  ##     (pruning is now expressed via the schema's x-kubernetes-preserve-unknown-
  ##     fields instead), so it's never present on the live object.
  ##   - /spec/conversion: the chart's engines/instancemanagers/replicas/settings
  ##     CRDs omit `conversion` entirely, but the API server always injects an
  ##     explicit `{strategy: None}` default; volumes/engineimages/nodes DO set
  ##     `conversion.strategy: Webhook` in the chart, but Longhorn injects its live
  ##     CA cert into webhook.clientConfig.caBundle at runtime, which is likewise
  ##     never in the applied manifest. Ignoring the whole /spec/conversion node
  ##     covers both cases for all 7 CRDs.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
        - /spec/preserveUnknownFields
        - /spec/conversion

## apps/infra-longhorn.yaml — Longhorn replicated storage (default StorageClass).
##
## Multi-source: the Helm chart from the Longhorn repo, with its values file read
## from THIS git repo via the `$values` ref (industry-standard "Helm chart +
## in-repo values" ArgoCD pattern). Wave 0 so storage exists before anything that
## needs a PVC.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.8.1
      helm:
        valueFiles:
          - $values/infra/longhorn/values.yaml
    - repoURL: https://git.kcfam.us/gtfs.zone/deploy-gtfs-rt.git
      targetRevision: k3s-init
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ## The Longhorn CRDs permanently drift from the rendered chart manifest for two
  ## unrelated reasons, neither of which is a real config problem:
  ##   - /status is populated by the API server itself (storedVersions,
  ##     acceptedNames, conditions) and is never part of the applied manifest.
  ##   - volumes/engineimages/nodes.longhorn.io use a conversion webhook, and
  ##     Longhorn injects its live CA cert into
  ##     spec.conversion.webhook.clientConfig.caBundle after creation. jsonPointers
  ##     for paths that don't exist on a given CRD (e.g. the caBundle path on the
  ##     4 non-conversion CRDs) are simply no-ops.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
        - /spec/conversion/webhook/clientConfig/caBundle

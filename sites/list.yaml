# ── list.gtfs.zone (globe-of-contents) ────────────────────────────────────────
# Static site served from an immutable image: CI builds `dist/` into
# `ghcr.io/gtfs-zone/gtfs-zone-feed-list` on a `v*` tag, pushes it, then commits
# the new digest into sites/kustomization.yaml, and ArgoCD rolls it out. A deploy
# is an image swap, and a rollback is `kustomize edit set image` back to the
# previous digest.
#
# The image is `nginxinc/nginx-unprivileged` based, so it listens on :8080 as
# uid 101 and needs no root anywhere in the chain.
#
# TLS: list.gtfs.zone is one label deep, so the `*.gtfs.zone` SAN on
# gtfs-zone-tls covers it.
#
# The catalogue data is not in this image: the site fetches it at runtime from
# data.gtfs.zone (Garage's public bucket, written by geometry-car).
#
# /feed/<id>/<slug> pages and /sitemap.xml are proxied by the pod's nginx from
# the same bucket, straight to Garage's web endpoint in-cluster (PAGES_UPSTREAM)
# rather than out and back through the public hostname.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: list
  namespace: sites
  labels:
    app: list
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: list
  template:
    metadata:
      labels:
        app: list
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: ghcr.io/gtfs-zone/gtfs-zone-feed-list
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PAGES_UPSTREAM
              value: http://garage.gtfs.svc.cluster.local:3902
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: list
  namespace: sites
spec:
  selector:
    app: list
  ports:
    - name: http
      port: 80
      targetPort: http
---
# The route lives in `gtfs`, not `sites`: Traefik resolves `tls.secretName` in
# the IngressRoute's own namespace, and the cert-manager Secrets are there.
# Pointing at a Service in another namespace is fine: the chart runs with
# `providers.kubernetesCRD.allowCrossNamespace: true`.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: list
  namespace: gtfs
  annotations:
    external-dns.alpha.kubernetes.io/target: "73.4.232.254"
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`list.gtfs.zone`)
      kind: Rule
      services:
        - name: list
          namespace: sites
          port: 80
  tls:
    secretName: gtfs-zone-tls

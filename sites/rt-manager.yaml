# ── rt-manager ────────────────────────────────────────────────────────────────
# Same shape as list.yaml for the Deployment and Service (see list.yaml for the
# image-workflow rationale, the unprivileged nginx, and why the IngressRoute
# lives in `gtfs`).
#
# rt-manager is not a standalone static site: it is the SPA half of the same
# app rt-api's `gtfs-manager` serves the JSON API for, same-origin. It is
# `manage.rt.gtfs.zone` itself now; its IngressRoute lives in
# `gtfs/ingressroutes.yaml` alongside the rest of that host's routing, not
# here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rt-manager
  namespace: sites
  labels:
    app: rt-manager
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: rt-manager
  template:
    metadata:
      labels:
        app: rt-manager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: ghcr.io/gtfs-zone/gtfs-zone-rt-manager
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rt-manager
  namespace: sites
spec:
  selector:
    app: rt-manager
  ports:
    - name: http
      port: 80
      targetPort: http

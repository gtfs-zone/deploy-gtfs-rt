# sites: the three static sites that used to live in home-docker's `static-sites`
# nginx container (one shared Docker volume, filled by a `cp -r` step in each
# repo's CI). Each is now an immutable image served by its own Deployment.
#
# No secrets in this tree, so no KSOPS: the `sites` ArgoCD Application uses a
# plain Kustomize source.
#
# The `images:` block below is the deploy trigger. Each site's CI, after pushing
# a new image, runs
#   kustomize edit set image git.kcfam.us/gtfs.zone/<repo>=<repo>@sha256:<digest>
# in this directory and commits, so what is deployed is always a digest recorded
# in git. `newTag` is only the human-readable starting point; once CI has run at
# least once these entries carry digests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- apex.yaml
- edit.yaml
- viz.yaml
- yard-master.yaml
images:
- digest: sha256:d00da069a0c89a3b7b539525bf2ee951a4b25eccc9795046bc3a88b299b6d2ee
  name: git.kcfam.us/gtfs.zone/coloring-book
  newName: git.kcfam.us/gtfs.zone/coloring-book
- digest: sha256:207b00a585912b2151ff47d73fe849b7598ec4f319b4fe960ca9cdbc17e86b2b
  name: git.kcfam.us/gtfs.zone/landing-zone
  newName: git.kcfam.us/gtfs.zone/landing-zone
- digest: sha256:8d1afd890543e39975d49b3e5d4b11b7bb3edfda969b6538cbe7d9338f77c754
  name: git.kcfam.us/gtfs.zone/test-track
  newName: git.kcfam.us/gtfs.zone/test-track
- digest: sha256:b4006677c917c72273ef12ff70dd9c5b79664c1c345dcc3923e4719789382fae
  name: git.kcfam.us/gtfs.zone/yard-master
  newName: git.kcfam.us/gtfs.zone/yard-master

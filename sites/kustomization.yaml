# sites: the static sites. The first three used to live in home-docker's
# `static-sites` nginx container (one shared Docker volume, filled by a `cp -r`
# step in each repo's CI). Each is now an immutable image served by its own
# Deployment.
#
# No secrets in this tree, so no KSOPS: the `sites` ArgoCD Application uses a
# plain Kustomize source.
#
# The `images:` block below is the deploy trigger. Each site's CI, after pushing
# a new image, runs
#   kustomize edit set image git.kcfam.us/gtfs.zone/<repo>=<repo>@sha256:<digest>
# in this directory and commits, so what is deployed is always a digest recorded
# in git. `newTag` is only the human-readable starting point; once CI has run at
# least once these entries carry digests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- apex.yaml
- edit.yaml
- viz.yaml
- yard-master.yaml
- list.yaml
images:
- digest: sha256:351ad681f9aaab3fdcb07ab5ae122a631b2133c431cd5b056360a9894ac6ae86
  name: git.kcfam.us/gtfs.zone/coloring-book
  newName: git.kcfam.us/gtfs.zone/coloring-book
- digest: sha256:f5bd2a2f4798e5ef8b1f28be15821d3fdd2df678de0523c4d845635c1ed2af2d
  name: git.kcfam.us/gtfs.zone/globe-of-contents
  newName: git.kcfam.us/gtfs.zone/globe-of-contents
- digest: sha256:160025b706e02f1391560f8fde140655b216be1ae89516388ae5033b3fdad91b
  name: git.kcfam.us/gtfs.zone/landing-zone
  newName: git.kcfam.us/gtfs.zone/landing-zone
- digest: sha256:5e339c5eefd1c2ca31b7945c5eb34b15bed9a0e226dce3af1f186de4d9e92a74
  name: git.kcfam.us/gtfs.zone/test-track
  newName: git.kcfam.us/gtfs.zone/test-track
- digest: sha256:77e4fbd7e3add2ab91d928b95ee667bc0d39d71892ad76f73cdf40ba951fd831
  name: git.kcfam.us/gtfs.zone/yard-master
  newName: git.kcfam.us/gtfs.zone/yard-master

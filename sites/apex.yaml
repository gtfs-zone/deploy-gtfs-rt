# ── gtfs.zone (landing-zone) ──────────────────────────────────────────────────
# Same shape as edit.yaml (see it for the rationale on the image workflow, the
# unprivileged nginx, and why the IngressRoute lives in `gtfs`).
#
# The apex is the one host here that needs its own certificate: a DNS wildcard
# matches at least one label, so `*.gtfs.zone` does NOT cover the bare apex.
# infra/cert-manager/manifests/certificate-apex.yaml issues `gtfs-zone-apex-tls`
# and documents the `_acme-challenge.gtfs.zone` collision it has to live with.
#
# Reaching this pod also requires the home-docker Traefik to SNI-passthrough the
# apex: its passthrough rule matches `^.+\.gtfs\.zone$`, which excludes
# `gtfs.zone` itself, so a `HostSNI(`gtfs.zone`)` router has to be added there
# alongside it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apex
  namespace: sites
  labels:
    app: apex
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: apex
  template:
    metadata:
      labels:
        app: apex
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: git.kcfam.us/gtfs.zone/landing-zone
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: apex
  namespace: sites
spec:
  selector:
    app: apex
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: apex
  namespace: gtfs
  # No `external-dns.alpha.kubernetes.io/target` here, deliberately: gtfs.zone's
  # own A record is maintained by hand at Porkbun, and this is the annotation
  # that would hand it to external-dns. Without a target the traefik source
  # emits no endpoint for this route at all (there is no status fallback for
  # IngressRoute), so external-dns neither creates nor deletes the apex.
  #
  # It is the one record external-dns cannot manage here, for two reasons that
  # compound:
  #   - Its ownership TXT would have to be named `a-gtfs.zone`. external-dns
  #     builds that name by prefixing `a-` to the first label, which at a
  #     two-label apex lands outside the zone entirely -- `a-gtfs.zone` is a
  #     different registrable domain, not a name in gtfs.zone. It cannot be
  #     created at Porkbun, and the webhook's attempt to force it back in wrote
  #     `a-gtfs.zone.gtfs.zone`, which external-dns never looks for.
  #   - The Porkbun webhook cannot EDIT an apex record regardless: it derives
  #     the record name by trimming the zone off the FQDN, leaving "" at the
  #     apex, and Record.Name is `json:"name,omitempty"`, so `/dns/edit` goes
  #     out with no name and Porkbun answers 400 EDIT_ERROR.
  # With the apex missing its marker, external-dns forced that impossible edit
  # every 60s, and a failed record fails the whole zone's batch. Leaving the
  # apex alone is what keeps every other name in gtfs.zone reconciling.
  #
  # The apex is a fair thing to keep by hand: it is one static A record for the
  # home IP, it was manually created to begin with, and home-docker already
  # needs a hand-written `HostSNI(`gtfs.zone`)` rule for it because its
  # passthrough wildcard `^.+\.gtfs\.zone$` does not match the bare domain.
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`gtfs.zone`)
      kind: Rule
      services:
        - name: apex
          namespace: sites
          port: 80
  tls:
    secretName: gtfs-zone-apex-tls

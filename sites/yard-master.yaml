# ── yard-master ─────────────────────────────────────────────────────────────
# Same shape as edit.yaml/viz.yaml for the Deployment and Service (see edit.yaml
# for the image-workflow rationale, the unprivileged nginx, and why the
# IngressRoute lives in `gtfs`).
#
# yard-master is not a standalone static site: it is the SPA half of the same
# app cafe-car's `gtfs-manager` serves the JSON API for, same-origin. It is
# `manage.rt.gtfs.zone` itself now; its IngressRoute lives in
# `gtfs/ingressroutes.yaml` alongside the rest of that host's routing, not
# here. The SQLAdmin app it replaced there is at `manage-old.rt.gtfs.zone` in
# the same file, until it's retired for good.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yard-master
  namespace: sites
  labels:
    app: yard-master
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: yard-master
  template:
    metadata:
      labels:
        app: yard-master
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: git.kcfam.us/gtfs.zone/yard-master
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: yard-master
  namespace: sites
spec:
  selector:
    app: yard-master
  ports:
    - name: http
      port: 80
      targetPort: http

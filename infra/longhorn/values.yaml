## infra/longhorn/values.yaml — Helm values for the Longhorn chart.
##
## Single-node cluster: keep 1 replica per volume (scales up automatically when
## more nodes join). Longhorn becomes the cluster's **default** StorageClass so
## every PVC (CNPG, Redis, uptime-kuma) lands on replicated Longhorn storage.
persistence:
  # Make `longhorn` the default StorageClass.
  defaultClass: true
  # One replica per volume on a single node (raise when nodes are added).
  defaultClassReplicaCount: 1
  # Keep the underlying volume if a PVC is deleted (we can reclaim manually).
  reclaimPolicy: Retain

defaultSettings:
  # Match the StorageClass default; new volumes get 1 replica.
  defaultReplicaCount: 1

# The chart ships a Helm `pre-upgrade` hook Job that ArgoCD maps to a **PreSync**
# hook. PreSync runs before the chart's own resources exist, so on a first
# install the Job deadlocks:
#   Error creating: pods "longhorn-pre-upgrade-" is forbidden: error looking up
#   service account longhorn-system/longhorn-service-account: not found
# ArgoCD then waits on the hook forever and the Application never leaves
# "Missing" — which is exactly what stalled this cluster for 8 days. Longhorn's
# own values.yaml says to disable this "when installing Longhorn using Argo CD
# or other GitOps solutions".
preUpgradeChecker:
  jobEnabled: false

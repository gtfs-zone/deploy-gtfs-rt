## infra/external-dns/values.yaml: Helm values for the kubernetes-sigs
## external-dns chart, using the Porkbun **webhook provider** (Porkbun has no
## native external-dns provider).
##
## Source = Traefik IngressRoute (traefik-proxy). Each gtfs IngressRoute (Phase 7)
## carries an `external-dns.alpha.kubernetes.io/target: <server_ip>` annotation, so
## external-dns creates the matching *.gtfs.zone records at Porkbun, retiring the
## old dns.tf. Porkbun creds come from the `porkbun-secret` Secret in the
## external-dns namespace (SOPS Secret, Phase 4; keys API_KEY / API_SECRET).
provider:
  name: webhook
  webhook:
    image:
      repository: ghcr.io/konnektr-io/external-dns-porkbun-webhook
      # v0.2.19 built the apex's new-format ownership TXT as
      # `a-gtfs.zone.gtfs.zone`: it treated external-dns's `a-gtfs.zone` as a
      # relative label and appended the zone again. external-dns then never saw
      # `a-gtfs.zone`, so every reconcile planned a forced update of the apex A
      # record, and the webhook could not resolve an apex record's ID to edit it
      # (Porkbun 400 EDIT_ERROR). One bad record failed the whole batch, so the
      # zone stopped reconciling entirely: no record was created or pruned for
      # hours, the retired uptime.gtfs.zone among them. v0.2.23 fixed the
      # double-domain naming, v0.3.0 added apex normalization and dropped the
      # no-op TXT updates that provoked it.
      tag: v0.3.0
    env:
      - name: API_KEY
        valueFrom:
          secretKeyRef:
            name: porkbun-secret
            key: API_KEY
      - name: API_SECRET
        valueFrom:
          secretKeyRef:
            name: porkbun-secret
            key: API_SECRET
      # `--domain-filter` is a REQUIRED flag on this binary; without it the
      # container exits immediately with a kingpin usage error. The chart passes
      # no args to the webhook, so it has to come from the env equivalent. Keep
      # in sync with the top-level `domainFilters` below.
      - name: DOMAIN_FILTER
        value: gtfs.zone
      # The binary defaults to :8888, but the chart hardcodes the webhook
      # containerPort to 8080 and points both probes at that port name, so on
      # the default the probes hit a closed port and the container restarts
      # forever. Move the binary to 8080 and point external-dns at it (see
      # extraArgs below) so the whole chain agrees on one port.
      - name: LISTEN_ADDRESS
        value: ":8080"
    # The chart's POD securityContext sets `runAsNonRoot: true` with no
    # `runAsUser`; the external-dns container supplies its own UID but this
    # sidecar inherits the pod's, and the image declares no USER. Kubelet
    # resolves the image user to root and refuses to start the container:
    #   Error: container has runAsNonRoot and image will run as root
    # Pin the same nonroot UID the external-dns container uses (verified: the
    # binary runs fine as 65532 and serves /healthz).
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      privileged: false
      readOnlyRootFilesystem: true
      runAsGroup: 65532
      runAsNonRoot: true
      runAsUser: 65532

# Only manage records under gtfs.zone.
domainFilters:
  - gtfs.zone

# Watch Traefik IngressRoute CRDs (adds the needed RBAC).
sources:
  - traefik-proxy

# The traefik-proxy source watches BOTH the modern `traefik.io` API group and the
# legacy `traefik.containo.us` one. Traefik v3 (chart 35.x) only ships the former,
# so external-dns blocks forever waiting for a cache sync on a CRD that does not
# exist and dies with:
#   fatal: failed to sync traefik.containo.us/v1alpha1, Resource=ingressrouteudps
# Disabling the legacy group is required, not cosmetic.
extraArgs:
  - --traefik-disable-legacy
  # Match the webhook sidecar's LISTEN_ADDRESS above (default would be :8888).
  - --webhook-provider-url=http://localhost:8080

# Full ownership: create AND delete records to match cluster state, tagged with a
# TXT owner record so external-dns only touches records it created.
policy: sync
registry: txt
txtOwnerId: gtfs-k3s

# ── Postgres (CloudNativePG) ──────────────────────────────────────────────────
# Replaces the TF `postgres` container + the `postgres-init` shell Job. The
# operator (infra-cnpg, Phase 3) reconciles this Cluster; declarative roles and
# databases replace the init container's psql CREATE USER/DATABASE loop.
#
#   superuser  postgres            ← superuserSecret (postgres-superuser)
#   role+db    rt_api / rt_api     ← bootstrap.initdb (owner role + its database)
#   role       traccar             ← managed.roles (passwordSecret)
#   db         traccar (owner ~)   ← Database CR below; Traccar migrates it itself
#
# Single instance on Longhorn (start fresh, no data migration). Image pinned to
# CNPG's Postgres 18.3 build to match the TF `postgres:18.3-alpine`.
#
# Sizing note: Traccar has no retention config key and writes every GPS fix to
# tc_positions forever, so this volume grows with fleet size × fix rate. 10Gi is
# the starting point; the nightly traccar-retention CronJob (gtfs/traccar/) is
# what actually bounds it.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: gtfs
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3

  storage:
    storageClass: longhorn
    size: 10Gi

  # Expose the `postgres` superuser (password from the SOPS Secret) so admin
  # tasks work as they did against the TF container.
  enableSuperuserAccess: true
  superuserSecret:
    name: postgres-superuser

  bootstrap:
    initdb:
      # Create the rt_api owner role + rt_api database in one shot. The owner
      # role's credential comes from the basic-auth Secret below.
      database: rt_api
      owner: rt_api
      secret:
        name: postgres-rt-api

  managed:
    roles:
      # Traccar's login role. Traccar runs its own Liquibase migrations against
      # this database on startup, so it needs ownership, not just connect.
      - name: traccar
        ensure: present
        login: true
        passwordSecret:
          name: postgres-traccar
      # Keycloak's login role, replacing dex. Keycloak builds and migrates its
      # own schema on startup, so it owns its database outright.
      - name: keycloak
        ensure: present
        login: true
        passwordSecret:
          name: postgres-keycloak
---
# The traccar database, owned by the managed `traccar` role. Traccar creates and
# migrates its own tc_* schema inside it on first boot.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: traccar
  namespace: gtfs
spec:
  cluster:
    name: postgres
  name: traccar
  owner: traccar
---
# The keycloak database, owned by the managed `keycloak` role. Keycloak builds
# and migrates its own schema on startup, so it owns its database outright.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: keycloak
  namespace: gtfs
spec:
  cluster:
    name: postgres
  name: keycloak
  owner: keycloak

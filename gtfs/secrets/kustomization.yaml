# gtfs/secrets: application secrets + private-registry imagePullSecret for the
# gtfs stack. Referenced by the gtfs Kustomize app (Phase 5/6); the presence of
# *.enc.yaml routes rendering through ArgoCD's ksops CMP. Both Secrets carry an
# explicit namespace (gtfs), so no namespace is set here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generators:
  - ./secret-generator.yaml

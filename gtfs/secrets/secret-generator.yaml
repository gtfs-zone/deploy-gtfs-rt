# KSOPS generator: decrypts the SOPS-encrypted gtfs Secret manifests at
# `kustomize build` time (run by ArgoCD's ksops CMP sidecar once the gtfs
# Application references this directory in Phase 5/6). Each file is a full Secret
# manifest emitted verbatim after decryption.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: secret-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./gtfs-app-secrets.enc.yaml
  - ./postgres-superuser.enc.yaml
  - ./postgres-keycloak.enc.yaml
  - ./postgres-rt-api.enc.yaml
  - ./postgres-traccar.enc.yaml

# ── IngressRoutes ─────────────────────────────────────────────────────────────
# Replaces the TF Traefik container labels. One IngressRoute per host on the
# `websecure` entrypoint (host :8443 via ServiceLB), all terminating with the
# cert-manager wildcard Secret `gtfs-zone-tls`.
#
# Every route carries `external-dns.alpha.kubernetes.io/target: <server_ip>` so
# external-dns creates the matching Porkbun record; this is what retired dns.tf.
#
# Auth: the two oauth2 Middlewares (oauth2-proxy.yaml) replace the TF ForwardAuth
# labels. Public by design: rt (the GTFS-RT feed), status (the Gatus status page),
# id + auth (the login flow itself), and both Traccar routes.
#
# TLS reaches this cluster untouched: home-docker's Traefik does SNI passthrough
# for *.gtfs.zone, so k3s owns gtfs.zone certificates end to end.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rt
  namespace: gtfs
  annotations:
    external-dns.alpha.kubernetes.io/target: "73.4.232.254"
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`rt.gtfs.zone`)
      kind: Rule
      services:
        - name: gtfs-api
          port: 8000
  tls:
    secretName: gtfs-zone-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: manage-rt
  namespace: gtfs
  annotations:
    external-dns.alpha.kubernetes.io/target: "73.4.232.254"
spec:
  entryPoints: [websecure]
  routes:
    # oauth2-proxy's own endpoints (sign_in page, /static assets, /callback) must
    # bypass ForwardAuth, otherwise the sign-in page's CSS/JS re-enter the auth
    # chain and come back as 401 HTML. Traefik prefers the longer rule.
    - match: Host(`manage.rt.gtfs.zone`) && PathPrefix(`/oauth2/`)
      kind: Rule
      services:
        - name: oauth2-proxy
          port: 4180
    # yard-master's JSON API, same-origin against cafe-car's gtfs-manager.
    - match: Host(`manage.rt.gtfs.zone`) && PathPrefix(`/api`)
      kind: Rule
      middlewares:
        - name: oauth2-errors
        - name: oauth2-proxy
      services:
        - name: gtfs-manager
          port: 8001
    - match: Host(`manage.rt.gtfs.zone`)
      kind: Rule
      middlewares:
        - name: oauth2-errors
        - name: oauth2-proxy
      services:
        - name: yard-master
          namespace: sites
          port: 80
  tls:
    secretName: gtfs-zone-tls
---
# Temporary home for cafe-car's SQLAdmin app while it's retired. Same shape
# manage-rt had before the yard-master cutover.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: manage-old
  namespace: gtfs
  annotations:
    external-dns.alpha.kubernetes.io/target: "73.4.232.254"
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`manage-old.rt.gtfs.zone`) && PathPrefix(`/oauth2/`)
      kind: Rule
      services:
        - name: oauth2-proxy
          port: 4180
    - match: Host(`manage-old.rt.gtfs.zone`) && PathPrefix(`/statics/`)
      kind: Rule
      services:
        - name: gtfs-manager
          port: 8001
    - match: Host(`manage-old.rt.gtfs.zone`)
      kind: Rule
      middlewares:
        - name: oauth2-errors
        - name: oauth2-proxy
      services:
        - name: gtfs-manager
          port: 8001
  tls:
    secretName: gtfs-zone-tls
---
# Keycloak, on its own host (id.gtfs.zone). Public by design: this is the
# login flow itself. Covered by the *.gtfs.zone wildcard in gtfs-zone-tls.
#
# Keycloak has no "default realm": it hardcodes `/` -> `/admin/` ->
# `/admin/master/console/`, which lands every visitor on the console of the
# built-in server-admin realm, where none of our users have an account. The two
# redirects below land people in the `gtfs` realm instead. `master` is not
# deletable and is still reachable at its full URL; it stays break-glass.
#
# 302, not 301: a permanent redirect on a bare hostname is cached by browsers
# indefinitely and is painful to walk back.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: keycloak-root-redirect
  namespace: gtfs
spec:
  redirectRegex:
    regex: ".*"
    replacement: "https://id.gtfs.zone/realms/gtfs/account/"
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: keycloak-admin-redirect
  namespace: gtfs
spec:
  redirectRegex:
    regex: ".*"
    replacement: "https://id.gtfs.zone/admin/gtfs/console/"
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak
  namespace: gtfs
  annotations:
    external-dns.alpha.kubernetes.io/target: "73.4.232.254"
spec:
  entryPoints: [websecure]
  routes:
    # Explicit priorities: Traefik otherwise ranks by rule length, and these two
    # must outrank the catch-all Host rule they share a host with.
    - match: Host(`id.gtfs.zone`) && Path(`/`)
      kind: Rule
      priority: 100
      middlewares:
        - name: keycloak-root-redirect
      services:
        - name: keycloak
          port: 8080
    - match: Host(`id.gtfs.zone`) && (Path(`/admin`) || Path(`/admin/`))
      kind: Rule
      priority: 100
      middlewares:
        - name: keycloak-admin-redirect
      services:
        - name: keycloak
          port: 8080
    - match: Host(`id.gtfs.zone`)
      kind: Rule
      priority: 10
      services:
        - name: keycloak
          port: 8080
  tls:
    secretName: gtfs-zone-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: auth
  namespace: gtfs
  annotations:
    external-dns.alpha.kubernetes.io/target: "73.4.232.254"
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`auth.gtfs.zone`)
      kind: Rule
      services:
        - name: oauth2-proxy
          port: 4180
  tls:
    secretName: gtfs-zone-tls
---
# Gatus, intentionally unauthenticated: the status page is the whole UI, and it is
# public by design. There is no separate dashboard host any more (uptime.gtfs.zone
# went away with Uptime Kuma); the check set lives in gtfs/gatus/config.yaml.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: status
  namespace: gtfs
  annotations:
    external-dns.alpha.kubernetes.io/target: "73.4.232.254"
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`status.gtfs.zone`)
      kind: Rule
      services:
        - name: gatus
          port: 8080
  tls:
    secretName: gtfs-zone-tls
---
# Traccar: one hostname, split by path, so drivers get no second confusable host.
#
#   /osmand  → :5055  phone reports (Traccar Client). Must stay unauthenticated:
#              a phone has no browser session; devices authenticate by uniqueId.
#   /*       → :8082  web console + REST API, which does its own Keycloak OIDC
#              login and so is deliberately NOT behind oauth2-proxy.
#
# No StripPrefix. Verified against traccar/traccar:6.14.5 that the osmand decoder
# ignores the request path entirely and reads only the query parameters: POSTs to
# `/osmand?id=...` and `/?id=...` both return 200 and store the position. Dropping
# the middleware keeps the phone-facing path the simplest thing that works.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traccar
  namespace: gtfs
  annotations:
    external-dns.alpha.kubernetes.io/target: "73.4.232.254"
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`traccar.gtfs.zone`) && PathPrefix(`/osmand`)
      kind: Rule
      services:
        - name: traccar-osmand
          port: 5055
    - match: Host(`traccar.gtfs.zone`)
      kind: Rule
      services:
        - name: traccar
          port: 8082
  tls:
    secretName: gtfs-zone-tls

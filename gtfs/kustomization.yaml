# gtfs stack — Kustomize root assembled by the `gtfs` ArgoCD Application. The
# `secrets` base contains *.enc.yaml, so ArgoCD routes the whole tree through the
# KSOPS CMP (`kustomize build --enable-alpha-plugins --enable-exec`).
#
# Phase 5 wires the stateful layer (Postgres + Redis) + secrets. The application
# layer (Dex, oauth2-proxy, rt-api, celery, uptime-kuma, IngressRoutes) is added
# to `resources` in Phases 6-7.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secrets
  - postgres-cluster.yaml
  - redis.yaml

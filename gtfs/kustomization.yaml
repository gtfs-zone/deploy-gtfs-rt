# gtfs stack: Kustomize root assembled by the `gtfs` ArgoCD Application. The
# `secrets` base contains *.enc.yaml, so ArgoCD routes the whole tree through the
# KSOPS CMP (`kustomize build --enable-alpha-plugins --enable-exec`).
#
# Phase 5 wired the stateful layer (Postgres + Redis) + secrets. Phase 6 adds the
# application layer (Keycloak, oauth2-proxy, rt-api + migrate hook, celery, uptime-kuma).
# Phase 6a adds the ingest layer (Traccar, vehicle-poser, hell-gate-bridge ×2).
# The IngressRoutes that expose these are added in Phase 7.
#
# The list below is flat rather than indented because `kustomize edit set image`
# rewrites this whole file, and geometry-car's CI runs it here on every push.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- secrets
- postgres-cluster.yaml
- redis.yaml
- garage.yaml
- keycloak
- oauth2-proxy.yaml
- rt-api.yaml
- rt-api-migrate.yaml
- celery.yaml
- gatus
- traccar
- vehicle-poser.yaml
- trip-updogger.yaml
- hell-gate-bridge.yaml
- geometry-car
- geometry-car-migrate.yaml
- ingressroutes.yaml
# Written by geometry-car's CI after it pushes, so what is deployed is the
# digest of exactly what was built rather than a moving tag.
images:
- digest: sha256:ec88e65c543141a9498e375c934a1246f7c43de41c5136cd1753a5ef31874e29
  name: git.kcfam.us/gtfs.zone/geometry-car
  newName: git.kcfam.us/gtfs.zone/geometry-car

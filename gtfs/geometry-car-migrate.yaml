# ── geometry-car migrate ──────────────────────────────────────────────────────
# Two migrations in one PreSync hook, in this order:
#
#   dagster instance migrate  → Dagster's own run, event-log and schedule tables
#   alembic upgrade head      → this repo's source/check_run/source_state tables
#
# Both live in the geometry_car database and neither touches the other's tables;
# geometry-car's alembic env.py filters autogenerate down to its own so a
# revision here can never propose dropping Dagster's.
#
# PostSync, not PreSync like gtfs-migrate, and the difference is load-bearing.
# ArgoCD applies ordinary resources only after the hooks they were gated behind
# have completed, so at PreSync time none of what this Job needs exists yet:
# not the postgres-geometry-car Secret it takes its password from, and not the
# CNPG role and Database the password is for. A PreSync hook here does not fail,
# it hangs - CreateContainerConfigError on the missing Secret, forever, taking
# the whole sync with it. garage-init is PostSync for the same reason.
#
# Nothing is lost by running after the rollout: Dagster's run and event-log
# tables are created by the storage layer on first connect, and this repo's own
# tables are only read by a pipeline run, which is triggered by the schedule or
# by hand. Re-running is safe - Alembic tracks applied versions and `instance
# migrate` is a no-op on an up-to-date schema.
#
# The instance config is written here rather than mounted from the
# geometry-car-dagster ConfigMap so the Job depends on nothing but its image and
# the Secret. Only the storage block is duplicated, and both copies read the
# same DATABASE_URL, so they cannot point at different databases.
#
# If this Job wedges, ArgoCD's hook-finalizer deadlocks against its own stuck
# operation. Clear the operation first:
#   kubectl patch app gtfs -n argocd --type merge -p '{"operation":null}'
# and only then remove the finalizer.
apiVersion: batch/v1
kind: Job
metadata:
  name: geometry-car-migrate
  namespace: gtfs
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: geometry-car-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: geometry-car-migrate
          image: git.kcfam.us/gtfs.zone/geometry-car:75becfe
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat > "$DAGSTER_HOME/dagster.yaml" <<'YAML'
              storage:
                postgres:
                  postgres_url:
                    env: DATABASE_URL
              YAML
              # CNPG creates the role and the database on its own schedule, so
              # the first run of this Job can land before either exists. Retry
              # rather than fail the sync on a race that resolves itself.
              for i in $(seq 1 30); do
                if dagster instance migrate && alembic upgrade head; then
                  exit 0
                fi
                echo "waiting for the geometry_car database"
                sleep 10
              done
              exit 1
          env:
            - name: DAGSTER_HOME
              value: /app/dagster_home
            - name: POSTGRES_GEOMETRY_CAR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-geometry-car
                  key: password
            - name: DATABASE_URL
              value: postgresql://geometry_car:$(POSTGRES_GEOMETRY_CAR_PASSWORD)@postgres-rw:5432/geometry_car

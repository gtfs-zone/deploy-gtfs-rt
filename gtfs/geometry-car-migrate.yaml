# ── geometry-car migrate ──────────────────────────────────────────────────────
# Two migrations in one PreSync hook, in this order:
#
#   dagster instance migrate  → Dagster's own run, event-log and schedule tables
#   alembic upgrade head      → this repo's source/check_run/source_state tables
#
# Both live in the geometry_car database and neither touches the other's tables;
# geometry-car's alembic env.py filters autogenerate down to its own so a
# revision here can never propose dropping Dagster's.
#
# PreSync, so it finishes before the three Deployments roll: a webserver that
# starts against un-migrated run storage fails on its first query. Re-running is
# safe - Alembic tracks applied versions and `instance migrate` is a no-op on an
# up-to-date schema.
#
# The instance config is written here rather than mounted from the
# geometry-car-dagster ConfigMap, because at PreSync time that ConfigMap does
# not exist: ArgoCD applies ordinary resources only after the hooks it gated
# them behind have completed. A hook that mounts one sits in ContainerCreating
# on FailedMount forever and takes the sync with it. Only the storage block is
# duplicated, and both copies read the same DATABASE_URL, so they cannot point
# at different databases.
#
# If this Job wedges, ArgoCD's hook-finalizer deadlocks against its own stuck
# operation. Clear the operation first:
#   kubectl patch app gtfs -n argocd --type merge -p '{"operation":null}'
# and only then remove the finalizer.
apiVersion: batch/v1
kind: Job
metadata:
  name: geometry-car-migrate
  namespace: gtfs
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: geometry-car-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: geometry-car-migrate
          image: git.kcfam.us/gtfs.zone/geometry-car:75becfe
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat > "$DAGSTER_HOME/dagster.yaml" <<'YAML'
              storage:
                postgres:
                  postgres_url:
                    env: DATABASE_URL
              YAML
              dagster instance migrate && alembic upgrade head
          env:
            - name: DAGSTER_HOME
              value: /app/dagster_home
            - name: POSTGRES_GEOMETRY_CAR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-geometry-car
                  key: password
            - name: DATABASE_URL
              value: postgresql://geometry_car:$(POSTGRES_GEOMETRY_CAR_PASSWORD)@postgres-rw:5432/geometry_car

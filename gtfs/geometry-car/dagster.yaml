# Dagster instance config, read from $DAGSTER_HOME/dagster.yaml by all three
# processes. Mounted by subPath so the rest of DAGSTER_HOME stays writable; the
# ConfigMap is hash-suffixed by the generator, so editing this file rolls the
# pods rather than waiting for a process that never re-reads it.
#
# Module paths are the `dagster._core` ones: `dagster.core` was removed and is
# not an alias, so the old spelling fails at startup with ImportError.

# Runs, events and schedule ticks all in Postgres, so the three pods share one
# view and nothing is lost when a pod is replaced. DATABASE_URL is the same
# value the pipeline's own Alembic tables use; Dagster creates its tables in
# that database itself and they collide with none of this repo's.
storage:
  postgres:
    postgres_url:
      env: DATABASE_URL

# DefaultRunLauncher, not K8sRunLauncher: on a single node a per-run Pod buys
# nothing and costs a ServiceAccount and RBAC. The cost is that a run executes
# as a subprocess inside the code-server pod, so that pod is what has to be
# sized for a whole run.
run_launcher:
  module: dagster._core.launcher
  class: DefaultRunLauncher

# Queued, so the daemon serialises runs: a daily run that overruns a day would
# otherwise have a second copy of itself hammering forty thousand origins.
run_coordinator:
  module: dagster._core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 1

# A run executes inside the code-server pod, so replacing that pod (an image
# bump) kills the run process mid-run. DefaultRunLauncher has no worker health
# check, so monitoring cannot see the process die; what reaches it instead is
# the runtime cap. A daily run takes ~40 min, so one still STARTED at 4h is
# dead: the daemon cancels it, the terminate reaches a code server that never
# knew the run and fails, and the cancel timeout then marks it CANCELED. That
# frees the single queue slot. The Gatus publish heartbeat is still the page.
# max_resume_run_attempts is 0 because DefaultRunLauncher cannot resume.
run_monitoring:
  enabled: true
  start_timeout_seconds: 300
  cancel_timeout_seconds: 300
  max_runtime_seconds: 14400
  max_resume_run_attempts: 0
  poll_interval_seconds: 120

# The webserver and the run live in different pods with no shared volume, so a
# local compute-log manager would write files the UI can never read and show an
# empty pane with no explanation. Structured events are in Postgres and visible
# in the UI; raw stdout is in `kubectl logs` on geometry-car-code.
compute_logs:
  module: dagster._core.storage.noop_compute_log_manager
  class: NoOpComputeLogManager

telemetry:
  enabled: false

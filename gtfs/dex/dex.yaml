# ── Dex (OIDC provider) ───────────────────────────────────────────────────────
# Replaces the TF `dex` container. Upstream dexidp/dex image + the config.yaml
# ConfigMap (generated in this dir's kustomization). Env vars feed the config's
# `{{ getenv }}` template calls; secret values come from the SOPS Secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: gtfs
  labels:
    app: dex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
    spec:
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.44.0
          args: ["dex", "serve", "/etc/dex/config.yaml"]
          ports:
            - name: http
              containerPort: 5556
          env:
            - name: DEX_ISSUER
              value: https://dex.gtfs.zone
            - name: DEX_OAUTH2_PROXY_REDIRECT_URI
              value: https://auth.gtfs.zone/oauth2/callback
            - name: DEX_GITLAB_BASE_URL
              value: https://gitlab.com
            - name: DEX_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-dex
                  key: password
            - name: DEX_OAUTH2_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: DEX_OAUTH2_PROXY_CLIENT_SECRET
            - name: DEX_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: GITHUB_CLIENT_ID
            - name: DEX_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: GITHUB_CLIENT_SECRET
            - name: DEX_GITLAB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: GITLAB_CLIENT_ID
            - name: DEX_GITLAB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: GITLAB_CLIENT_SECRET
            - name: DEX_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: GOOGLE_CLIENT_ID
            - name: DEX_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gtfs-app-secrets
                  key: GOOGLE_CLIENT_SECRET
          volumeMounts:
            - name: config
              mountPath: /etc/dex
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: dex-config
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: gtfs
spec:
  selector:
    app: dex
  ports:
    - name: http
      port: 5556
      targetPort: http

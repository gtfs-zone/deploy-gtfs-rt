# Dex config — rendered into a ConfigMap by the configMapGenerator in this dir's
# kustomization. The upstream dexidp/dex image runs this file through gomplate at
# startup to expand the env-var template calls below, so this is the same config
# the old custom `dex` image shipped, with one change for k8s: the Postgres host
# is CNPG's read-write service `postgres-rw` (was the `postgres` container).
#
# NB: gomplate templates the WHOLE file, comments included — so do not write a
# bare template call in a comment to describe the syntax. An argument-less one
# here previously crashed dex at boot with
#   wrong number of args for getenv: want at least 1 got 0
issuer: {{ getenv "DEX_ISSUER" }}

storage:
  type: postgres
  config:
    host: postgres-rw
    port: 5432
    database: dex
    user: dex
    password: {{ getenv "DEX_POSTGRES_PASSWORD" }}
    ssl:
      mode: disable

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

connectors:
{{- if getenv "DEX_GITHUB_CLIENT_ID" }}
  - type: github
    id: github
    name: GitHub
    config:
      clientID: {{ getenv "DEX_GITHUB_CLIENT_ID" }}
      clientSecret: {{ getenv "DEX_GITHUB_CLIENT_SECRET" }}
      redirectURI: {{ getenv "DEX_ISSUER" }}/callback
      scopes:
        - read:user
        - user:email
{{- end }}
{{- if getenv "DEX_GITLAB_CLIENT_ID" }}
  - type: gitlab
    id: gitlab
    name: GitLab
    config:
      baseURL: {{ getenv "DEX_GITLAB_BASE_URL" }}
      clientID: {{ getenv "DEX_GITLAB_CLIENT_ID" }}
      clientSecret: {{ getenv "DEX_GITLAB_CLIENT_SECRET" }}
      redirectURI: {{ getenv "DEX_ISSUER" }}/callback
{{- end }}
{{- if getenv "DEX_GOOGLE_CLIENT_ID" }}
  - type: google
    id: google
    name: Google
    config:
      clientID: {{ getenv "DEX_GOOGLE_CLIENT_ID" }}
      clientSecret: {{ getenv "DEX_GOOGLE_CLIENT_SECRET" }}
      redirectURI: {{ getenv "DEX_ISSUER" }}/callback
{{- end }}

staticClients:
  - id: oauth2-proxy
    redirectURIs:
      - '{{ getenv "DEX_OAUTH2_PROXY_REDIRECT_URI" }}'
    name: oauth2-proxy
    secret: {{ getenv "DEX_OAUTH2_PROXY_SECRET" }}
  # Traccar authenticates its *manager* users against Dex directly (it is not
  # behind oauth2-proxy). Traccar's OIDC callback is the app root.
  - id: traccar
    redirectURIs:
      - '{{ getenv "DEX_TRACCAR_REDIRECT_URI" }}'
    name: Traccar
    secret: {{ getenv "DEX_TRACCAR_SECRET" }}

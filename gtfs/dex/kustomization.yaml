# Dex component — Deployment + Service + its config ConfigMap. The
# configMapGenerator renders config.yaml into a hash-suffixed `dex-config`
# ConfigMap; kustomize rewrites the Deployment's volume reference to the hashed
# name, so a config change rolls the Deployment automatically.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gtfs
resources:
  - dex.yaml
configMapGenerator:
  - name: dex-config
    files:
      - config.yaml

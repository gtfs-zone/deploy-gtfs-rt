# feed-catalog component: the three Dagster Deployments, their two Services,
# timetable-sites' code server as a second code location, and the instance-config
# ConfigMap. Its own directory because the generator
# hash-suffixes that ConfigMap, so editing dagster.yaml or workspace.yaml rolls
# the pods - the gtfs/gatus/ pattern.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gtfs
resources:
  - feed-catalog.yaml
  - timetable-sites.yaml
configMapGenerator:
  - name: feed-catalog-dagster
    files:
      - dagster.yaml
      - workspace.yaml

name: Check

# On a push to a branch or a pull request: runs a Kustomize render of the
# stack, schema-checked with kubeconform. On a pull request it also rejects any
# commit whose message is not a Conventional Commit; the commit-msg hook does
# the same locally but can be skipped.

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

env:
  KUBECONFORM_VERSION: "0.6.7"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # kustomize ships with the ubuntu runner image. The ksops stub stands in
      # for the KSOPS exec plugin: kustomize runs it as a KRM generator, and an
      # empty ResourceList drops the encrypted Secrets, so CI never needs the
      # age private key.
      - name: Install kubeconform and a ksops stub
        run: |
          kustomize version
          curl -sL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform
          sudo tee /usr/local/bin/ksops > /dev/null <<'STUB'
          #!/bin/sh
          echo 'apiVersion: config.kubernetes.io/v1'
          echo 'kind: ResourceList'
          echo 'items: []'
          STUB
          sudo chmod +x /usr/local/bin/ksops

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Same render as scripts/check.sh, with the encrypted Secrets dropped.
      - name: Render gtfs
        run: |
          mkdir -p rendered
          kustomize build --enable-alpha-plugins --enable-exec gtfs \
            | tee rendered/gtfs.yaml

      - name: Render sites
        run: kustomize build sites | tee rendered/sites.yaml

      # CRDs (IngressRoute, Cluster, Certificate, Application, Middleware) have
      # no upstream schema, so missing schemas are ignored; core Kubernetes
      # objects are still validated strictly.
      - name: Validate manifests
        run: |
          kubeconform -strict -ignore-missing-schemas -summary \
            rendered \
            apps \
            infra/argocd/manifests \
            infra/cert-manager/manifests

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      # Full history and the PR head, not the merge commit, so only the PR's
      # own commits are in the range.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Same commitizen version as the commit-msg hook in .pre-commit-config.yaml.
      - name: Check commit messages
        run: uvx --from commitizen==4.13.9 cz check --rev-range "origin/${BASE_REF}..HEAD"
        env:
          BASE_REF: ${{ github.base_ref }}

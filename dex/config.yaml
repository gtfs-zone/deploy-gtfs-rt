issuer: {{ getenv "DEX_ISSUER" }}

storage:
  type: postgres
  config:
    host: postgres
    port: 5432
    database: dex
    user: dex
    password: {{ getenv "DEX_POSTGRES_PASSWORD" }}
    ssl:
      mode: disable

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

connectors:
  - type: github
    id: github
    name: GitHub
    config:
      clientID: {{ getenv "DEX_GITHUB_CLIENT_ID" }}
      clientSecret: {{ getenv "DEX_GITHUB_CLIENT_SECRET" }}
      redirectURI: {{ getenv "DEX_ISSUER" }}/callback
      scopes:
        - read:user
        - user:email

staticClients:
  - id: oauth2-proxy
    redirectURIs:
      - '{{ getenv "DEX_OAUTH2_PROXY_REDIRECT_URI" }}'
    name: oauth2-proxy
    secret: {{ getenv "DEX_OAUTH2_PROXY_SECRET" }}

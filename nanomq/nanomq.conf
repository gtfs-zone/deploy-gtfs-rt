mqtt {
    allow_anonymous = false
}

listeners.tcp {
    bind = "0.0.0.0:1883"
}

listeners.ws {
    bind = "0.0.0.0:8083/mqtt"
}

auth {
    http_auth {
        enable = true

        auth_req {
            url = "http://gtfs-api:8000/mqtt/auth"
            method = "POST"
            headers.content-type = "application/x-www-form-urlencoded"
            params = {username = "%u", password = "%P"}
        }

        acl_req {
            url = "http://gtfs-api:8000/mqtt/acl"
            method = "POST"
            headers.content-type = "application/x-www-form-urlencoded"
            params = {username = "%u", topic = "%t", access = "%A"}
            deny_action = disconnect
        }
    }
}

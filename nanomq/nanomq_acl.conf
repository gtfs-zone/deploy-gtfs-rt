no_match = deny
deny_action = disconnect

rules = [
  ## Allow everyone to subscribe to owntracks topics (bridge needs this)
  {"permit": "allow", "action": "subscribe", "topics": ["owntracks/#"]}

  ## Allow users to publish only to their own owntracks prefix
  {"permit": "allow", "username": "#", "action": "publish", "topics": ["owntracks/${username}/#"]}

  ## Deny everything else
  {"permit": "deny"}
]
